name: Build & Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.scheme }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            theos: theos/theos
          - scheme: roothide
            theos: roothide/theos
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check translations
        run: python3 scripts/check_strings.py

      - name: Compute version
        id: version
        run: |
          version=$(grep '^Version:' control | cut -d' ' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" app/Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" app/Resources/Info.plist

      - name: Install build tools
        run: |
          brew install ldid make dpkg xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos (${{ matrix.theos }})
        run: |
          git clone --quiet --depth 1 --recursive https://github.com/${{ matrix.theos }}.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build package
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} PACKAGE_VERSION=$VERSION THEOS_PLATFORM_DEB_COMPRESSION_TYPE=xz THEOS_PLATFORM_DEB_COMPRESSION_LEVEL=6

      - name: Rename & inspect package
        run: |
          mkdir -p out
          for deb in packages/*.deb; do
            arch=$(dpkg-deb -f "$deb" Architecture)
            name="xixu_${VERSION}_${{ matrix.scheme }}_${arch}.deb"
            cp "$deb" "out/$name"
            dpkg-deb --info "out/$name"
            dpkg-deb --contents "out/$name" | tee contents.txt
            grep -q 'usr/libexec/xixuhelper' contents.txt || { echo "helper missing"; exit 1; }
            grep -q 'Xixu.app/Xixu$' contents.txt || { echo "app missing"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: xixu-${{ matrix.scheme }}
          path: out/*.deb
          retention-days: 3

  release:
    name: Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "| File | Jailbreak |"
            echo "|---|---|"
            for f in dist/*.deb; do
              n=$(basename "$f")
              case "$n" in
                *roothide*) echo "| \`$n\` | roothide (Bootstrap) |" ;;
                *) echo "| \`$n\` | rootless (Dopamine, palera1n, nathanlr) |" ;;
              esac
            done
            echo
            awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Xixu ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: dist/*.deb
          overwrite_files: true
          make_latest: true
